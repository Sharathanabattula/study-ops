name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/study-ops.js --version
          node bin/study-ops.js init
          node bin/study-ops.js audit-funds --location london --duration 12 --tuition 38000 --apply-date 2027-07-01
          node bin/study-ops.js audit-profile
          node bin/study-ops.js cost --tuition 38000 --duration 12 --zone inner
