name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for form-filling tests
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/study-ops.js --version
          node bin/study-ops.js init
          node bin/study-ops.js audit-funds --location london --duration 12 --tuition 38000 --apply-date 2027-07-01
          node bin/study-ops.js audit-profile
          node bin/study-ops.js cost --tuition 38000 --duration 12 --zone inner
          node bin/study-ops.js portals
          node bin/study-ops.js form-pack
          node bin/study-ops.js scholarships --no-internal
          node bin/study-ops.js arrival --course-start 2027-09-27
